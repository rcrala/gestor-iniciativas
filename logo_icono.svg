<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="iconHighlight" cx="28%" cy="22%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <rect width="140" height="140" rx="32" fill="url(#iconBg)"/>
    <rect width="140" height="140" rx="32" fill="url(#iconHighlight)"/>

    <rect x="36" y="74"  width="68" height="12" rx="6" fill="white"/>
    <rect x="36" y="93"  width="52" height="12" rx="6" fill="white" fill-opacity="0.85"/>
    <rect x="36" y="112" width="40" height="12" rx="6" fill="white" fill-opacity="0.7"/>

    <g transform="translate(82, 48)" filter="url(#sparkGlow)">
      <path d="M 0 -20 C 1.5 -9 4.5 -4.5 20 0 C 4.5 4.5 1.5 9 0 20 C -1.5 9 -4.5 4.5 -20 0 C -4.5 -4.5 -1.5 -9 0 -20 Z" fill="url(#sparkGrad)"/>
      <circle cx="0" cy="0" r="2.5" fill="white" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
