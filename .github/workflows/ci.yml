name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-scripts:
    name: Validate scripts and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run INNOVA validators (full repo scan)
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/validate/run-validators.ps1 -AllFiles

  validate-solutions:
    name: Pack Power Platform solutions (smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack all solutions found (unmanaged smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $solutions = Get-ChildItem -Path solutions -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName 'Other/Solution.xml')
          }
          if (-not $solutions) {
            Write-Host "::warning::No solutions with Other/Solution.xml found; nothing to pack."
            exit 0
          }
          foreach ($sol in $solutions) {
            $zipName = "$($sol.Name).zip"
            $zipPath = "out/$zipName"
            Write-Host "::group::Pack $($sol.Name)"
            pac solution pack --folder $sol.FullName --zipfile $zipPath --packagetype Unmanaged
            $size = (Get-Item $zipPath).Length
            Write-Host "Packed $zipName ($size bytes)"
            Write-Host "::endgroup::"
          }

      - name: Upload solution artifacts (PR smoke evidence)
        uses: actions/upload-artifact@v4
        with:
          name: solutions-unmanaged-pr-${{ github.event.pull_request.number || github.run_number }}
          path: out/*.zip
          retention-days: 7
          if-no-files-found: warn

  test-plugins:
    name: Test C# Plug-ins (prod plugins/)
    runs-on: ubuntu-latest
    if: hashFiles('plugins/**/*.csproj') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build plugins/ --configuration Release

      - name: Test
        run: dotnet test plugins/ --no-build --configuration Release

  test-samples-dotnet:
    name: Test sample NUnit (tests/plugins/Sample.Tests)
    runs-on: ubuntu-latest
    if: hashFiles('tests/plugins/**/*.csproj') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run NUnit samples
        run: dotnet test tests/plugins/ --nologo

  lint-pcf:
    name: Lint PCF Controls (prod pcf/)
    runs-on: ubuntu-latest
    if: hashFiles('pcf/**/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and lint
        working-directory: pcf
        run: |
          npm ci
          npm run lint
          npm run build

  test-samples-pcf:
    name: Test sample Jest (tests/pcf/sample)
    runs-on: ubuntu-latest
    if: hashFiles('tests/pcf/**/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + test sample
        working-directory: tests/pcf/sample
        run: |
          npm install --no-audit --no-fund
          npm test
